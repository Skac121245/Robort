        <div id="logHeader" style="position: relative; cursor: pointer; background: #444; padding: 2px;" onclick="toggleLogWindow()">
            <div id="minMax">Log (click to minimize)</div>
            <button id="exportLogBtn" style="position: absolute; top: 2px; right: 2px; background: transparent; border: none; color: white; cursor: pointer; font-size: 14px;" onclick="exportLog(event)">&#x1F4BE;</button>
          </div>
        <div id="logContent"></div>

      <script>
      function toggleLogWindow(){
          var logContent = document.getElementById('logContent');
          if(logContent.style.display === 'none'){
               logContent.style.display = 'block';
               document.getElementById('logWindow').style.height = '150px';
               document.getElementById('minMax').textContent = "Log (click to minimize)"
          } else {
               logContent.style.display = 'none';
               document.getElementById('logWindow').style.height = 'auto';
               document.getElementById('minMax').textContent = "Log (click to maximize)"
          }
      }
      
      // Override console.log to also write to our log window
      (function(){
  var originalLog = console.log;
  console.log = function(...args){
    originalLog.apply(console, args);
    var logContent = document.getElementById('logContent');
    if(logContent){
       var timestamp = new Date().toLocaleTimeString();
       var message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
       var p = document.createElement('div');
       p.textContent = "[" + timestamp + "] " + message;
       logContent.appendChild(p);
       // Auto-scroll to the bottom so the latest message is visible:
       logContent.scrollTop = logContent.scrollHeight;
    }
  };
})();

function exportLog(e) {
  // Prevent the header click event from toggling the log window
  e.stopPropagation();
  var logContent = document.getElementById('logContent').innerText;
  var blob = new Blob([logContent], { type: 'text/plain' });
  var url = URL.createObjectURL(blob);
  
  var a = document.createElement('a');
  a.href = url;
  a.download = 'log.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function logAction(action, actionType) {
  const scoutingData = JSON.parse(sessionStorage.getItem('scoutingData'));
  // Clear redoStack because a new action invalidates redo history.
  redoStack = [];
  if (actionType === 'pickup' || typeof scoutingData.currentActionIndex === 'undefined') {
    // Start a new action.
    scoutingData.teleopActions.push({ pickup: action, shot_place: null });
    scoutingData.currentActionIndex = scoutingData.teleopActions.length - 1;
    if (actionType === 'pickup'){
      showAdditionalActions();
    }
  } else {
    // Update the current action.
    scoutingData.teleopActions[scoutingData.currentActionIndex].shot_place = action;
    delete scoutingData.currentActionIndex;
    hideAdditionalActions();
  }
  
  sessionStorage.setItem('scoutingData', JSON.stringify(scoutingData));
  console.log(action + ' action logged.');
  updateUndoRedoButtons(); // Ensure UI reflects the new history.
}

        let rotationAngle = 0;
        const scale = 498 / 1152;  // Use this scale for vertical rotations (90° & 270°)
const vOffset0 = 0;    // No extra shift for 0°
const vOffset90 = 600; // Adjust this value for 90° rotation
const vOffset180 = -580;  // Adjust this value for 180° rotation if needed
const vOffset270 = 600; // Adjust this value for 270° rotation

function rotateField() {
  // Increase rotation in 90° increments: 0, 90, 180, 270
  rotationAngle = (rotationAngle + 90) % 360;
  const inner = document.getElementById('fieldInner');
  const endgameContainer = document.getElementById('endgameContainer');

  // Reset button transforms so text remains normal (we’ll adjust for 180° separately)
  document.querySelectorAll('#fieldInner button, #endgameContainer button').forEach(button => {
    button.style.transform = "none";
  });

  // Always rotate about the center of the inner content
  inner.style.transformOrigin = "center center";
  endgameContainer.style.transformOrigin = "center center";
  if (rotationAngle === 0) {
  inner.style.transform = `rotate(0deg) scale(1) translateY(${vOffset0}px)`;
  endgameContainer.style.transform = `rotate(0deg) scale(1) translateY(${vOffset0}px)`;
} else if (rotationAngle === 90) {
  inner.style.transform = `rotate(90deg) scale(${scale}) translateX(${vOffset90}px)`;
  // For 90°, take the original 180 mapping and rotate it 90°.
  // (For example, the numbers below are suggestions – adjust as needed.)
  endgameContainer.style.transform =
      "rotate(90deg) scale(-1, -1) translateX(600px) translateY(340px)";
} else if (rotationAngle === 180) {
  inner.style.transform = `rotate(180deg) scale(1) translateY(${vOffset180}px)`;
  // Use your original mapping for 180°:
  endgameContainer.style.transform =
      "scale(-1, -1) translateY(-600px) translateX(-340px)";
  document.querySelectorAll('#fieldInner button, #endgameContainer button').forEach(button => {
    button.style.transform = "scale(-1, -1)";
  });
} else if (rotationAngle === 270) {
  inner.style.transform = `rotate(270deg) scale(${scale}) translateX(${-vOffset270}px)`;
  // For 270°, rotate the original 180 mapping by 270°.
  endgameContainer.style.transform =
      "rotate(270deg) scale(-1, -1) translateX(-600px) translateY(-340px)";
}

}






// Undo / Redo Stuff


function undoAction() {
  const scoutingData = JSON.parse(sessionStorage.getItem('scoutingData'));
  if (scoutingData.teleopActions && scoutingData.teleopActions.length > 0) {
    const undoneAction = scoutingData.teleopActions.pop();
    redoStack.push(undoneAction);
    sessionStorage.setItem('scoutingData', JSON.stringify(scoutingData));
    
    if (undoneAction.shot_place === 'endgame') {
      // When undoing an endgame action, show the endgame UI again
      document.getElementById('endgameContainer').style.display = 'block';
      document.getElementById('endgameOutcome').style.display = 'block';
    } else {
      if (scoutingData.teleopActions.length > 0) {
        const lastAction = scoutingData.teleopActions[scoutingData.teleopActions.length - 1];
        if (!lastAction.shot_place) {
          showAdditionalActions();
        } else {
          hideAdditionalActions();
        }
      } else {
        hideAdditionalActions();
      }
    }
    logTemporaryMessage("Undid action: " + (undoneAction.pickup || undoneAction));
    updateUndoRedoButtons();
  } else {
    logTemporaryMessage("No actions to undo.");
    updateUndoRedoButtons();
  }
}

function redoAction() {
  if (redoStack.length > 0) {
    const action = redoStack.pop();
    const scoutingData = JSON.parse(sessionStorage.getItem('scoutingData'));
    scoutingData.teleopActions = scoutingData.teleopActions || [];
    scoutingData.teleopActions.push(action);
    sessionStorage.setItem('scoutingData', JSON.stringify(scoutingData));
    
    if (action.shot_place === 'endgame') {
      document.getElementById('endgameContainer').style.display = 'block';
      document.getElementById('endgameOutcome').style.display = 'block';
    } else {
      if (!action.shot_place) {
         showAdditionalActions();
      } else {
         hideAdditionalActions();
      }
    }
    logTemporaryMessage("Redid action: " + (action.pickup || action));
  } else {
    logTemporaryMessage("No actions to redo.");
  }
  updateUndoRedoButtons(); // <-- Call update after changes
}

  // Optionally, initialize scoutingData if it doesn't exist
  let scoutingData = JSON.parse(sessionStorage.getItem('scoutingData')) || {};

  updateUndoRedoButtons();
};



function updateUndoRedoButtons() {
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const scoutingData = JSON.parse(sessionStorage.getItem('scoutingData') || '{}');

  if (!scoutingData.teleopActions || scoutingData.teleopActions.length === 0) {
    undoBtn.disabled = true;
    undoBtn.style.opacity = 0.5;
  } else {
    undoBtn.disabled = false;
    undoBtn.style.opacity = 1;
  }

  if (!redoStack || redoStack.length === 0) {
    redoBtn.disabled = true;
    redoBtn.style.opacity = 0.5;
  } else {
    redoBtn.disabled = false;
    redoBtn.style.opacity = 1;
  }
}



function logTemporaryMessage(message) {
  var logContent = document.getElementById('logContent');
  if (logContent) {
    var tempMsg = document.createElement('div');
    tempMsg.textContent = message;
    // Start fully opaque; add a CSS transition for fading
    tempMsg.style.opacity = 1;
    tempMsg.style.transition = "opacity 1s linear";
    logContent.appendChild(tempMsg);
    
    // After 2 seconds, trigger fade-out over 1 second then remove the message
    setTimeout(function() {
      tempMsg.style.opacity = 0;
      setTimeout(function() {
        if (tempMsg.parentNode) {
          tempMsg.parentNode.removeChild(tempMsg);
        }
      }, 1000);
    }, 2000);
  }
}
function clearUndoRedoState() {
  let scoutingData = JSON.parse(sessionStorage.getItem('scoutingData')) || {};
  scoutingData.teleopActions = [];
  sessionStorage.setItem('scoutingData', JSON.stringify(scoutingData));
  redoStack = [];
}

function confirmRefresh() {
  if (sessionStorage.getItem('scoutingData') && reloadCheck === 0) {
    showCustomConfirm("You haven't downloaded your data yet. Are you sure you want to refresh?", function(confirmed) {
      if (confirmed) {
        clearUndoRedoState();
        location.reload();
      }
    });
  } else {
    clearUndoRedoState();
    location.reload();
  }
}
