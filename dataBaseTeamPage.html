// Resets inline styles for dynamic elements to prevent overlapping.
function resetPositions() {
  // Reset position and note buttons.
  const allButtons = document.querySelectorAll('.position-btnB, .position-btnR, .note-btn');
  allButtons.forEach(btn => {
    btn.style.top = '';    // Clear any inline top style.
    btn.style.left = '';   // Clear any inline left style.
    btn.style.display = 'none'; // Hide the element by default.
  });
  
  // Reset driver station buttons.
  const driverStations = document.querySelectorAll('.driver-station-btnB, .driver-station-btnR');
  driverStations.forEach(btn => {
    btn.style.display = 'none';
  });
  
  // Reset endgame buttons if necessary.
  const endgameButtons = document.querySelectorAll('#endgame button');
  endgameButtons.forEach(btn => {
    btn.style.display = 'none'; // or set to your default if needed.
  });
}

// Validates the loaded JSON for required attributes.
// If any are missing, shows a popup alert listing them.
function validateData(data) {
  // List the attributes you expect.
  const requiredAttributes = [
    'teamNumber',
    'matchNumber',
    'autoActions',
    'teleopActions',
    'endgameActions',
    'robotPosition',
    'driverStation'
  ];
  let missing = [];
    if (!data.hasOwnProperty("matchNumber") || data["matchNumber"] === null || data["matchNumber"] === '') {
    throw alert("Invalid match JSON. Please try again with a different file.");
    }
  requiredAttributes.forEach(attr => {
    // Checks if the attribute is missing, null, or empty.
    if (!data.hasOwnProperty(attr) || data[attr] === null || data[attr] === '') {
      missing.push(attr);
    }
  });
  if (missing.length > 0) {
    alert("Warning: The JSON file is missing the following attributes: " + missing.join(", "));
  }
}
